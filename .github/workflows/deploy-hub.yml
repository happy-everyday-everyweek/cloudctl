name: deploy-hub

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['worker/**']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查密钥是否已配置
        id: guard
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "未配置 CLOUDFLARE_API_TOKEN，跳过部署"
            echo "skip=1" >> $GITHUB_OUTPUT
          else
            echo "skip=0" >> $GITHUB_OUTPUT
          fi

      - name: 部署 Worker
        if: steps.guard.outputs.skip != '1'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker/hub
          command: deploy

      - name: 提醒
        if: steps.guard.outputs.skip != '1'
        run: |
          echo "部署完成。首次使用请设置令牌："
          echo "  wrangler secret put HUB_TOKEN --cwd worker/hub"
          echo "然后把设备的 config.json 里 server_url 指向 Worker 域名。"
