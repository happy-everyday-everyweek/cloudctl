name: build-agent

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['agent/**', '.github/workflows/build-agent.yml']
  workflow_dispatch:

# 发布 Release 需要写权限；仓库默认只读时，缺少这段会导致打 tag 后步骤失败
permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 代码自检
        working-directory: agent
        run: python -m compileall -q cloudctl_agent run_agent.py

      - name: 打包单文件 exe
        working-directory: agent
        run: pyinstaller --noconfirm --clean --onefile --name cloudctl-agent --add-data "cloudctl_agent/devstatic;cloudctl_agent/devstatic" --hidden-import websockets --hidden-import pynput --hidden-import pynput.keyboard --hidden-import pynput.mouse --collect-submodules pynput run_agent.py

      - name: 静态资源检查
        working-directory: agent
        run: dir cloudctl_agent\devstatic

      - name: 生成 sha256 校验文件
        id: sha
        working-directory: agent
        run: |
          $hash = (Get-FileHash dist/cloudctl-agent.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path dist/cloudctl-agent.exe.sha256 -Value $hash -NoNewline
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output "artifact sha256 = $hash"

      - uses: actions/upload-artifact@v4
        with:
          name: cloudctl-agent-windows
          path: |
            agent/dist/cloudctl-agent.exe
            agent/dist/cloudctl-agent.exe.sha256
          if-no-files-found: error

      - name: 打 Tag 时发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            agent/dist/cloudctl-agent.exe
            agent/dist/cloudctl-agent.exe.sha256
          generate_release_notes: true
          body: |
            cloudctl-agent ${{ github.ref_name }}
            OTA 资产：cloudctl-agent.exe 与 cloudctl-agent.exe.sha256
            sha256: ${{ steps.sha.outputs.sha256 }}
            设备侧开启 OTA：rules.update.enabled=true，可配 channel/tag、verify_sha、auto_apply。
