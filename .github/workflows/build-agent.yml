name: build-agent

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['agent/**', '.github/workflows/build-agent.yml']
  workflow_dispatch:

# 发布 Release 需要写权限；仓库默认只读时，缺少这段会导致打 tag 后步骤失败
permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 代码自检
        working-directory: agent
        run: python -m compileall -q cloudctl_agent run_agent.py

      - name: "可选内嵌构建配置（仓库 secret CLOUDCTL_BUILD_CONFIG）"
        working-directory: agent
        shell: pwsh
        env:
          CLOUDCTL_BUILD_CONFIG: ${{ secrets.CLOUDCTL_BUILD_CONFIG }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CLOUDCTL_BUILD_CONFIG)) {
            Write-Output "未提供 CLOUDCTL_BUILD_CONFIG，跳过内嵌（exe 旁放 config.json 依旧可用）"
          } else {
            Set-Content -Path cloudctl_agent/build_config.json -Value $env:CLOUDCTL_BUILD_CONFIG -Encoding utf8 -NoNewline
            Write-Output "已写入 cloudctl_agent/build_config.json，将内嵌进 exe"
          }

      - name: 打包单文件 exe
        working-directory: agent
        shell: pwsh
        run: |
          $extra = @()
          if (Test-Path cloudctl_agent/build_config.json) {
            $extra += "--add-data"
            $extra += "cloudctl_agent/build_config.json;cloudctl_agent/build_config.json"
          }
          pyinstaller --noconfirm --clean --onefile --name cloudctl-agent --add-data "cloudctl_agent/devstatic;cloudctl_agent/devstatic" @extra --hidden-import websockets --hidden-import pynput --hidden-import pynput.keyboard --hidden-import pynput.mouse --collect-submodules pynput run_agent.py

      - name: 校验 tag 与代码版本一致（避免可执行文件里的版本与 tag 对不上）
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: agent
        shell: pwsh
        run: |
          $m = Select-String -Path cloudctl_agent/main.py -Pattern '^VERSION = "([^"]+)"' | Select-Object -First 1
          $v = $m.Matches.Groups[1].Value
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($v -ne $tag) { Write-Error "版本不一致：main.py=$v tag=$tag"; exit 1 }
          Write-Output "版本一致：$v"

      - name: 静态资源检查
        working-directory: agent
        run: dir cloudctl_agent\devstatic

      - name: 生成 sha256 校验文件
        id: sha
        working-directory: agent
        run: |
          $hash = (Get-FileHash dist/cloudctl-agent.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path dist/cloudctl-agent.exe.sha256 -Value $hash -NoNewline
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output "artifact sha256 = $hash"

      - uses: actions/upload-artifact@v4
        with:
          name: cloudctl-agent-windows
          path: |
            agent/dist/cloudctl-agent.exe
            agent/dist/cloudctl-agent.exe.sha256
          if-no-files-found: error

      - name: 打 Tag 时发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            agent/dist/cloudctl-agent.exe
            agent/dist/cloudctl-agent.exe.sha256
          generate_release_notes: true
          body: |
            cloudctl-agent ${{ github.ref_name }}
            OTA 资产：cloudctl-agent.exe 与 cloudctl-agent.exe.sha256
            sha256: ${{ steps.sha.outputs.sha256 }}
            设备侧开启 OTA：rules.update.enabled=true，可配 channel/tag、verify_sha、auto_apply。
